# Nixpacks = headless Chromium (no Xvfb). For headed + Xvfb on Railway, deploy with the repo Dockerfile instead.
[phases.setup]
nixPkgs = ["nodejs_20", "python3"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["npm install -g playwright && npx playwright install chromium"]

[start]
cmd = "node server.js"

